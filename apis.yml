  name: Doppler REST API
  description: >-
    Versioned REST API (v3) for managing Doppler workplaces, projects, environments, configs, secrets,
    dynamic secrets, service tokens, service accounts, integrations, audit logs, and webhooks. Authentication
    uses high-entropy Doppler tokens (CLI, Personal, Service, Service Account, Service Account Identity,
    SCIM, or Audit) presented as Bearer tokens.
